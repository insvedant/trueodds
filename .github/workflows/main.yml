name: ML Pipeline

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run'
        required: false
        default: 'collect'
        type: choice
        options:
          - collect
          - train
          - both

jobs:
  collect:
    name: Collect Odds Snapshot
    if: "github.event_name == 'schedule' || github.event.inputs.job == 'collect' || github.event.inputs.job == 'both'"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ml/requirements.txt
      - name: Install dependencies
        run: pip install -r ml/requirements.txt
      - name: Run collection snapshot
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          THEODDSAPI_KEY: ${{ secrets.THEODDSAPI_KEY }}
          PYTHONPATH: ${{ github.workspace }}
        run: python ml/run_collect.py
      - name: Report completion
        if: always()
        run: echo "Collection completed at $(date -u)"

  train:
    name: Retrain ML Models
    if: "github.event.inputs.job == 'train' || github.event.inputs.job == 'both'"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ml/requirements.txt
      - name: Install dependencies
        run: pip install -r ml/requirements.txt
      - name: Train ML models
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          THEODDSAPI_KEY: ${{ secrets.THEODDSAPI_KEY }}
          PYTHONPATH: ${{ github.workspace }}
        run: python -m ml.models.train
      - name: Report results
        if: always()
        run: echo "Training completed at $(date -u)"
