name: ML Pipeline

on:
  schedule:
    # Collect data every 5 minutes
    - cron: '*/5 * * * *'
    # Retrain models every 24 hours at 2am UTC
    - cron: '0 2 * * *'
    # Keepalive ping every 4 minutes to prevent Oracle VM idle throttling
    - cron: '*/4 * * * *'
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run'
        required: false
        default: 'collect'
        type: choice
        options:
          - collect
          - train
          - both
          - historical
          - keepalive

jobs:
  collect:
    name: Collect Odds Snapshot
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '*/5 * * * *') ||
      (github.event_name == 'workflow_dispatch' && (inputs.job == 'collect' || inputs.job == 'both'))
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ml/requirements.txt

      - name: Install dependencies
        run: pip install -r ml/requirements.txt

      - name: Run one collection snapshot
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          THEODDSAPI_KEY: ${{ secrets.THEODDSAPI_KEY }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -c "
import asyncio, sys
sys.path.insert(0, '.')
from ml.collect_data import collect_snapshot, setup_indexes, get_db
db = get_db()
setup_indexes(db)
result = asyncio.run(collect_snapshot())
print('Snapshots collected:', result)
"

  train:
    name: Retrain ML Models
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 2 * * *') ||
      (github.event_name == 'workflow_dispatch' && (inputs.job == 'train' || inputs.job == 'both'))
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ml/requirements.txt

      - name: Install dependencies
        run: pip install -r ml/requirements.txt

      - name: Train ML models
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          THEODDSAPI_KEY: ${{ secrets.THEODDSAPI_KEY }}
          PYTHONPATH: ${{ github.workspace }}
        run: python -m ml.models.train

      - name: Report training results
        if: always()
        run: echo "Training job completed at $(date -u)"

  keepalive:
    name: Oracle VM Keepalive Ping
    # Runs on the */4 cron AND any other trigger so the VM never goes cold
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '*/4 * * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.job == 'keepalive')
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping Backend
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          ML_API_URL:  ${{ secrets.ML_API_URL }}
        run: |
          echo "Pinging backend: $BACKEND_URL"
          curl -sf --max-time 10 "${BACKEND_URL}/health" || echo "Backend ping failed (may be starting up)"
          echo "Pinging ML API: $ML_API_URL"
          curl -sf --max-time 10 "${ML_API_URL}/health"  || echo "ML API ping failed (may be starting up)"
          echo "Keepalive done at $(date -u)"

  historical:
    name: Import Historical Data
    if: |
      github.event_name == 'workflow_dispatch' && inputs.job == 'historical'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ml/requirements.txt

      - name: Install dependencies
        run: pip install -r ml/requirements.txt

      - name: Run historical import (90 days)
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          THEODDSAPI_KEY: ${{ secrets.THEODDSAPI_KEY }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -c "
import sys
sys.path.insert(0, '.')
from ml.import_historical import import_all_sports
result = import_all_sports()
print('Historical import result:', result)
"

      - name: Report import results
        if: always()
        run: echo "Historical import completed at $(date -u)"
