name: ML Pipeline

on:
  schedule:
    - cron: '*/30 * * * *'   # collect every 30 min
    - cron: '0 2 * * *'      # retrain daily at 2am UTC
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run'
        required: false
        default: 'collect'
        type: choice
        options:
          - collect
          - train
          - both

jobs:
  collect:
    name: Collect Odds Snapshot
    # Runs on: every 30-min schedule, OR manual collect/both
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '*/30 * * * *') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'collect' || github.event.inputs.job == 'both'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ml/requirements.txt

      - name: Install dependencies
        run: pip install -r ml/requirements.txt

      - name: Run collection snapshot
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          THEODDSAPI_KEY: ${{ secrets.THEODDSAPI_KEY }}
          PYTHONPATH: ${{ github.workspace }}
        run: python ml/run_collect.py

      - name: Report completion
        if: always()
        run: echo "Collection completed at $(date -u)"

  train:
    name: Retrain ML Models
    # Runs on: daily 2am schedule, OR manual train/both
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 2 * * *') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'train' || github.event.inputs.job == 'both'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ml/requirements.txt

      - name: Install dependencies
        run: pip install -r ml/requirements.txt

      - name: Train ML models
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          THEODDSAPI_KEY: ${{ secrets.THEODDSAPI_KEY }}
          PYTHONPATH: ${{ github.workspace }}
        run: python -m ml.models.train

      - name: Report results
        if: always()
        run: echo "Training completed at $(date -u)"

  # Keeps the repo "active" so GitHub never pauses scheduled workflows
  keepalive:
    name: Keep Workflow Active
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Keep workflow active
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow enable ml-scheduler.yml 2>/dev/null || true
          echo "Keepalive ping at $(date -u)"
