name: ML Data Collector

on:
  schedule:
    # Runs every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ml/requirements.txt

      - name: Install dependencies
        run: pip install -r ml/requirements.txt

      - name: Run one collection snapshot
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          THEODDSAPI_KEY: ${{ secrets.THEODDSAPI_KEY }}
          PYTHONPATH: ${{ github.workspace }}
        run: python -c "
import asyncio
import sys
sys.path.insert(0, '.')
from ml.collect_data import collect_snapshot, setup_indexes, get_db
db = get_db()
setup_indexes(db)
result = asyncio.run(collect_snapshot())
print('Collection result:', result)
"
