name: ML Pipeline

on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run'
        required: false
        default: 'collect'
        type: choice
        options:
          - collect
          - train
          - both

jobs:
  collect:
    name: Collect Odds Snapshot
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '*/5 * * * *') ||
      (github.event_name == 'workflow_dispatch' && (inputs.job == 'collect' || inputs.job == 'both'))
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ml/requirements.txt
      - name: Install dependencies
        run: pip install -r ml/requirements.txt
      - name: Run one collection snapshot
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          THEODDSAPI_KEY: ${{ secrets.THEODDSAPI_KEY }}
          PYTHONPATH: ${{ github.workspace }}
        run: python -c "
import asyncio
import sys
sys.path.insert(0, '.')
from ml.collect_data import collect_snapshot, setup_indexes, get_db
db = get_db()
setup_indexes(db)
result = asyncio.run(collect_snapshot())
print('Collection result:', result)
"

  train:
    name: Retrain ML Models
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '0 2 * * *') ||
      (github.event_name == 'workflow_dispatch' && (inputs.job == 'train' || inputs.job == 'both'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ml/requirements.txt
      - name: Install dependencies
        run: pip install -r ml/requirements.txt
      - name: Train ML models
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          THEODDSAPI_KEY: ${{ secrets.THEODDSAPI_KEY }}
          PYTHONPATH: ${{ github.workspace }}
        run: python -m ml.models.train
      - name: Report results
        if: always()
        run: echo "Training completed at $(date -u)"
