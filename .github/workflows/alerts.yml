name: Alert Scheduler

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch:           # manual trigger from GitHub UI

jobs:
  send-alerts:
    name: Check & Send Alerts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install dependencies
        run: cd backend && npm install --production

      - name: Run alert scheduler
        env:
          MONGODB_URI:    ${{ secrets.MONGODB_URI }}
          ZOHO_USER:      ${{ secrets.ZOHO_USER }}
          ZOHO_PASSWORD:  ${{ secrets.ZOHO_PASSWORD }}
          FRONTEND_URL:   ${{ secrets.FRONTEND_URL }}
          THEODDSAPI_KEY: ${{ secrets.THEODDSAPI_KEY }}
        run: cd backend && node src/scripts/runAlerts.js

      - name: Report
        if: always()
        run: echo "Alert scheduler completed at $(date -u)"
